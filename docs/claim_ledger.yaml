{
  "schema_version": "1.0",
  "snapshot_date": "2026-08-09",
  "scope": "Quantitative scientific and reproducibility claims on the tracked release surfaces README.md, REPRODUCIBILITY.md, submission/memo.md, submission/index.html. Administrative dates, citation years and identifiers, HTML/CSS values, media timecodes, and the explicitly local-only hard-pairs DATASET_CARD.md are excluded. A destination path records where a claim appears in the release candidate; it is not evidence that the path is externally published.",
  "_schema": {
    "description": "One record per distinct quantitative claim. Rounded public forms remain separate from exact source values, and known gaps or correction requirements are explicit.",
    "document_format": "JSON-compatible YAML, parsed by scripts/validate_repro_metadata.py with the Python standard library.",
    "status_definitions": {
      "current": "The current source artifact supports the value and no correction gate is documented for the quantitative claim.",
      "needs_reconfirmation": "The current artifact matches the public value, but the master plan requires a mask-aware or submission-commit rerun.",
      "needs_correction": "The numeric source exists, but at least one public destination gives the experiment an unsupported interpretation or incompatible scope.",
      "source_gap": "The release surface contains the value, but no machine-readable generating artifact was found."
    },
    "destination_state": "tracked_release_surface means present in a candidate public artifact, not verified public deployment.",
    "digest_policy": "Recorded SHA-256 values identify evidence snapshots. The validator checks digest form and source-path existence, not byte identity, because analytical outputs may change concurrently; final byte matching belongs at the freeze gate.",
    "source_path_policy": "Source and destination paths are repository-relative and must exist unless a source_gap claim explicitly uses a null source path.",
    "required_claim_fields": [
      "id",
      "claim_text",
      "metric",
      "source_artifact",
      "generating_command",
      "public_destinations",
      "status",
      "notes"
    ],
    "field_descriptions": {
      "metric": "name, exact source value, public reported forms, and unit; source values may be structured when one sentence reports a set.",
      "source_artifact": "Repository path, row/field selector, and SHA-256 when recorded; needs_reconfirmation hashes may preserve the prior supporting snapshot.",
      "generating_command": "Exact command when discoverable; null is allowed only when notes explain that the claim is static or unsourced.",
      "public_destinations": "Every tracked release surface carrying the claim, with a human-readable locator.",
      "notes": "Scope limitation, provenance gap, rounding explanation, or required follow-up."
    }
  },
