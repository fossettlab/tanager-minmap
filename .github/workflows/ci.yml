name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # These exercise every Python marker branch in the universal uv lock:
        # <3.12, 3.12-<3.14, and >=3.14.
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      # Check out both repos as siblings so the local development override for
      # tanager-spec resolves. The release gate requires tanager-spec to be
      # public and immutably identified before this workflow is enabled.
      - name: Check out tanager-minmap
        uses: actions/checkout@v4
        with:
          path: tanager-minmap

      - name: Check out tanager-spec (shared data layer)
        uses: actions/checkout@v4
        with:
          repository: fossettlab/tanager-spec
          ref: v0.1.0
          path: tanager-spec

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync environment
        working-directory: tanager-minmap
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Ruff lint
        working-directory: tanager-minmap
        run: uv run ruff check src tests scripts

      - name: Ruff format check
        working-directory: tanager-minmap
        run: uv run ruff format --check src tests scripts

      - name: Pytest
        working-directory: tanager-minmap
        run: uv run pytest

      - name: Validate reproducibility metadata
        working-directory: tanager-minmap
        run: uv run python scripts/validate_repro_metadata.py

      - name: Build both wheels
        run: |
          uv build tanager-spec
          uv build tanager-minmap

      - name: Install built wheels in an isolated environment
        run: |
          uv venv wheel-venv --python ${{ matrix.python-version }}
          uv pip install --python wheel-venv/bin/python \
            tanager-spec/dist/*.whl tanager-minmap/dist/*.whl
          wheel-venv/bin/python -c "import tanager_minmap, tanager_spec"
          wheel-venv/bin/tanager-minmap --help
